AWSTemplateFormatVersion: "2010-09-09"
Description: Deploy a vscode-server on an EC2 instance with CloudFront distribution for web access
#------------------------------------------------------
# Mappings CloudFront PrefixListId
#------------------------------------------------------
Mappings:
  CloudFrontPrefixListIdMappings:
    us-west-2:
      PrefixListId: "pl-82a045eb"
    us-east-1:
      PrefixListId: "pl-3b927c52"
    us-east-2:
      PrefixListId: "pl-b6a144df"
    ap-southeast-1:
      PrefixListId: "pl-31a34658"
    # (2025-11-09) KSH: 서울 리전 추가
    ap-northeast-2:
      PrefixListId: "pl-22a6434b"
  RegionShortCode:
    ap-northeast-2:
      Code: apne2
    us-east-1:
      Code: use1
    us-west-2:
      Code: usw2

#------------------------------------------------------
# Parameters
#------------------------------------------------------
Parameters:
  InstanceType:
    Description: WebServer EC2 instance type
    Type: String
    # Default: t2.xlarge
    # GPU: g5.12xlarge
    Default: m8i.2xlarge
    ConstraintDescription: must be a valid EC2 instance type.
  LatestAmiId:
    Description: latest image id for ubuntu
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    # Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    # GPU: /aws/service/deeplearning/ami/x86_64/oss-nvidia-driver-gpu-pytorch-2.4-ubuntu-22.04/latest/ami-id
    # Refer to: https://docs.aws.amazon.com/ko_kr/dlami/latest/devguide/aws-deep-learning-ami-gpu-pytorch-2.4-ubuntu-22-04.html
    Default: "/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id"
  InternetCidrBlock:
    Type: String
    Description: UserCidrBlock
    Default: 0.0.0.0/0
  VSCodeServerVersion:
    Type: String
    Description: VSCodeServerVersion
    Default: 4.109.5
  OriginRequestPolicyId:
    Type: String
    Description: origin request policy id
    Default: 216adef6-5c7f-47e4-b989-5492eafa07d3
  GitHubAccessToken:
    Type: String
    Description: GitHub Personal Access Token for cloning private repositories (leave empty to skip)
    Default: ""
    NoEcho: true
  RemoteSSHPublicKey:
    Type: String
    Description: SSH public key for VSCode Remote SSH (leave empty to skip)
    Default: ""
  ProjectName:
    Type: String
    Description: Project name to clone and deploy
    Default: "ax-on-mastery"
  DeployProjectResource:
    Type: String
    Description: Whether to deploy project resources (True/False)
    Default: "True"
    AllowedValues:
      - "True"
      - "true"
      - "False"
      - "false"
  DeployInitMinimal:
    Type: String
    Description: Whether to deploy minimal initialization resources (True/False)
    Default: "False"
    AllowedValues:
      - "True"
      - "true"
      - "False"
      - "false"
  AvailabilityZone:
    Type: String
    Description: Availability Zone for EC2 instance (a, b, c, d, or auto for StackId-based selection)
    Default: "auto"
    AllowedValues:
      - "a"
      - "b"
      - "c"
      - "d"
      - "auto"
  AWSAccessKeyId:
    Type: String
    Description: AWS Access Key ID for AWS CLI configuration (leave empty to skip)
    Default: ""
    NoEcho: true
  AWSSecretAccessKey:
    Type: String
    Description: AWS Secret Access Key for AWS CLI configuration (leave empty to skip)
    Default: ""
    NoEcho: true
  AWSBearerTokenBedrock:
    Type: String
    Description: AWS Bearer Token for Bedrock authentication (leave empty to skip)
    Default: ""
    NoEcho: true
  OpenAIAPIKey:
    Type: String
    Description: OpenAI API Key (leave empty to skip)
    Default: ""
    NoEcho: true
#------------------------------------------------------
# VPC and Network Resources
#------------------------------------------------------
Resources:
  # VPC
  VSCodeServerVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: VSCodeServer-VPC

  # Internet Gateway
  VSCodeServerIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: VSCodeServer-IGW

  VSCodeServerIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VSCodeServerVPC
      InternetGatewayId: !Ref VSCodeServerIGW

  # Public Subnets
  VSCodeServerPublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VSCodeServerVPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Sub "${AWS::Region}a"
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VSCodeServer-Public-Subnet-A

  VSCodeServerPublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VSCodeServerVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Sub "${AWS::Region}b"
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VSCodeServer-Public-Subnet-B

  VSCodeServerPublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VSCodeServerVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Sub "${AWS::Region}c"
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VSCodeServer-Public-Subnet-C

  VSCodeServerPublicSubnetD:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VSCodeServerVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Sub "${AWS::Region}d"
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VSCodeServer-Public-Subnet-D

  # Private Subnets
  VSCodeServerPrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VSCodeServerVPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Sub "${AWS::Region}a"
      Tags:
        - Key: Name
          Value: VSCodeServer-Private-Subnet-A

  VSCodeServerPrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VSCodeServerVPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Sub "${AWS::Region}b"
      Tags:
        - Key: Name
          Value: VSCodeServer-Private-Subnet-B

  VSCodeServerPrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VSCodeServerVPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Sub "${AWS::Region}c"
      Tags:
        - Key: Name
          Value: VSCodeServer-Private-Subnet-C

  VSCodeServerPrivateSubnetD:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VSCodeServerVPC
      CidrBlock: 10.0.13.0/24
      AvailabilityZone: !Sub "${AWS::Region}d"
      Tags:
        - Key: Name
          Value: VSCodeServer-Private-Subnet-D

  # Public Route Table
  VSCodeServerPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VSCodeServerVPC
      Tags:
        - Key: Name
          Value: VSCodeServer-Public-RT

  VSCodeServerPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VSCodeServerIGWAttachment
    Properties:
      RouteTableId: !Ref VSCodeServerPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VSCodeServerIGW

  VSCodeServerPublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VSCodeServerPublicSubnetA
      RouteTableId: !Ref VSCodeServerPublicRouteTable

  VSCodeServerPublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VSCodeServerPublicSubnetB
      RouteTableId: !Ref VSCodeServerPublicRouteTable

  VSCodeServerPublicSubnetCRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VSCodeServerPublicSubnetC
      RouteTableId: !Ref VSCodeServerPublicRouteTable

  VSCodeServerPublicSubnetDRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VSCodeServerPublicSubnetD
      RouteTableId: !Ref VSCodeServerPublicRouteTable

  # Private Route Table
  VSCodeServerPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VSCodeServerVPC
      Tags:
        - Key: Name
          Value: VSCodeServer-Private-RT

  VSCodeServerPrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VSCodeServerPrivateSubnetA
      RouteTableId: !Ref VSCodeServerPrivateRouteTable

  VSCodeServerPrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VSCodeServerPrivateSubnetB
      RouteTableId: !Ref VSCodeServerPrivateRouteTable

  VSCodeServerPrivateSubnetCRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VSCodeServerPrivateSubnetC
      RouteTableId: !Ref VSCodeServerPrivateRouteTable

  VSCodeServerPrivateSubnetDRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VSCodeServerPrivateSubnetD
      RouteTableId: !Ref VSCodeServerPrivateRouteTable

  # S3 Gateway VPC Endpoint
  VSCodeServerS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VSCodeServerVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref VSCodeServerPublicRouteTable
        - !Ref VSCodeServerPrivateRouteTable

#------------------------------------------------------
# S3 Bucket
#------------------------------------------------------
  # Lambda Role for S3 Bucket Management (Create or Use Existing)
  S3BucketManagementLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3BucketManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'

  # Lambda Function for S3 Bucket Management
  S3BucketManagementLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt S3BucketManagementLambdaRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging
          import time
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info(f'Event: {event}')
              bucket_name = event['ResourceProperties']['BucketName']
              region = event['ResourceProperties']['Region']

              # Create clients inside handler to avoid initialization issues
              s3_client = boto3.client('s3')
              s3_resource = boto3.resource('s3')

              try:
                  if event['RequestType'] == 'Create' or event['RequestType'] == 'Update':
                      bucket_exists = False
                      try:
                          # Check if bucket exists
                          s3_client.head_bucket(Bucket=bucket_name)
                          bucket_exists = True
                          logger.info(f'Bucket {bucket_name} already exists, using existing bucket')
                      except ClientError as e:
                          error_code = e.response['Error']['Code']
                          logger.info(f'HeadBucket returned error code: {error_code}')

                          if error_code == '404' or error_code == 'NoSuchBucket':
                              # Bucket doesn't exist, we'll create it
                              bucket_exists = False
                          elif error_code == '403' or error_code == 'Forbidden':
                              # Bucket exists but we don't have access, assume it's managed elsewhere
                              logger.info(f'Bucket {bucket_name} exists but access denied, assuming it is managed elsewhere')
                              cfnresponse.send(event, context, cfnresponse.SUCCESS, {'BucketName': bucket_name})
                              return
                          else:
                              raise

                      if not bucket_exists:
                          # Bucket doesn't exist, create it
                          logger.info(f'Creating bucket: {bucket_name}')
                          try:
                              if region == 'us-east-1':
                                  s3_client.create_bucket(Bucket=bucket_name)
                              else:
                                  s3_client.create_bucket(
                                      Bucket=bucket_name,
                                      CreateBucketConfiguration={'LocationConstraint': region}
                                  )

                              # Wait a moment for bucket to be fully created
                              time.sleep(2)

                              # Configure bucket settings
                              s3_client.put_public_access_block(
                                  Bucket=bucket_name,
                                  PublicAccessBlockConfiguration={
                                      'BlockPublicAcls': True,
                                      'BlockPublicPolicy': True,
                                      'IgnorePublicAcls': True,
                                      'RestrictPublicBuckets': True
                                  }
                              )

                              s3_client.put_bucket_encryption(
                                  Bucket=bucket_name,
                                  ServerSideEncryptionConfiguration={
                                      'Rules': [{
                                          'ApplyServerSideEncryptionByDefault': {
                                              'SSEAlgorithm': 'AES256'
                                          }
                                      }]
                                  }
                              )

                              s3_client.put_bucket_tagging(
                                  Bucket=bucket_name,
                                  Tagging={
                                      'TagSet': [
                                          {'Key': 'Name', 'Value': 'SageMaker-Models-S3Bucket'}
                                      ]
                                  }
                              )

                              logger.info(f'Successfully created and configured bucket: {bucket_name}')
                          except ClientError as e:
                              if e.response['Error']['Code'] == 'BucketAlreadyExists' or e.response['Error']['Code'] == 'BucketAlreadyOwnedByYou':
                                  logger.info(f'Bucket {bucket_name} already exists (race condition), using existing bucket')
                              else:
                                  raise

                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'BucketName': bucket_name})

                  elif event['RequestType'] == 'Delete':
                      try:
                          logger.info(f'Emptying and deleting bucket: {bucket_name}')
                          bucket = s3_resource.Bucket(bucket_name)

                          # Delete all objects
                          bucket.objects.all().delete()

                          # Delete all object versions
                          bucket.object_versions.all().delete()

                          # Delete the bucket
                          s3_client.delete_bucket(Bucket=bucket_name)
                          logger.info(f'Successfully deleted bucket: {bucket_name}')
                      except ClientError as e:
                          error_code = e.response['Error']['Code']
                          if error_code == '404' or error_code == 'NoSuchBucket':
                              logger.info(f'Bucket {bucket_name} does not exist, nothing to delete')
                          else:
                              logger.warning(f'Error deleting bucket {bucket_name}: {str(e)}. Continuing anyway.')

                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

              except Exception as e:
                  logger.error(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  # Custom Resource for S3 Bucket Management
  SageMakerModelsS3Bucket:
    Type: Custom::S3BucketManagement
    Properties:
      ServiceToken: !GetAtt S3BucketManagementLambda.Arn
      BucketName: !Sub
        - "${ProjectName}-sm-models-${AWS::AccountId}-${RegionCode}"
        - ProjectName: !Ref ProjectName
          RegionCode: !FindInMap [RegionShortCode, !Ref "AWS::Region", Code]
      Region: !Ref AWS::Region

#------------------------------------------------------
# Lambda for AZ Selection
#------------------------------------------------------
  AZSelectionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EC2DescribePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstanceTypeOfferings
                Resource: '*'

  AZSelectionLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AZSelectionLambdaRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info(f'Event: {event}')

              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      stack_id = event['StackId']
                      region = event['ResourceProperties']['Region']
                      instance_type = event['ResourceProperties']['InstanceType']
                      az_param = event['ResourceProperties']['AvailabilityZoneParam']
                      subnet_a = event['ResourceProperties']['SubnetA']
                      subnet_b = event['ResourceProperties']['SubnetB']
                      subnet_c = event['ResourceProperties']['SubnetC']
                      subnet_d = event['ResourceProperties']['SubnetD']

                      # Create EC2 client
                      ec2_client = boto3.client('ec2', region_name=region)

                      # Get available AZs for the instance type
                      logger.info(f'Checking availability for instance type: {instance_type} in region: {region}')
                      response = ec2_client.describe_instance_type_offerings(
                          LocationType='availability-zone',
                          Filters=[
                              {
                                  'Name': 'instance-type',
                                  'Values': [instance_type]
                              }
                          ]
                      )

                      # Extract AZ suffixes (a, b, c, d) from available AZs
                      available_azs = []
                      for offering in response['InstanceTypeOfferings']:
                          az = offering['Location']
                          # Extract suffix (e.g., 'us-east-1a' -> 'a')
                          az_suffix = az[-1]
                          if az_suffix in ['a', 'b', 'c', 'd']:
                              available_azs.append(az_suffix)

                      logger.info(f'Available AZs for {instance_type}: {available_azs}')

                      if not available_azs:
                          raise Exception(f'No availability zones found for instance type {instance_type} in region {region}')

                      # Determine AZ suffix based on mode
                      if az_param == 'auto':
                          # Extract guid from StackId for deterministic selection
                          guid = stack_id.split('/')[-1]
                          first_char = guid[0].lower()

                          # Preferred AZ based on guid
                          if first_char in '0123':
                              preferred_az = 'a'
                          elif first_char in '4567':
                              preferred_az = 'b'
                          elif first_char in '89ab':
                              preferred_az = 'c'
                          else:
                              preferred_az = 'd'

                          # Use preferred AZ if available, otherwise use first available
                          if preferred_az in available_azs:
                              az_suffix = preferred_az
                              logger.info(f'Auto mode - Using preferred AZ: {az_suffix} (based on StackId: {stack_id})')
                          else:
                              az_suffix = available_azs[0]
                              logger.info(f'Auto mode - Preferred AZ {preferred_az} not available, using first available: {az_suffix}')
                      else:
                          # Manual mode - verify the specified AZ is available
                          if az_param in available_azs:
                              az_suffix = az_param
                              logger.info(f'Manual mode - Using specified AZ: {az_suffix}')
                          else:
                              # Fallback to first available AZ
                              az_suffix = available_azs[0]
                              logger.warning(f'Manual mode - Specified AZ {az_param} not available for {instance_type}, falling back to: {az_suffix}')

                      # Select subnet based on AZ
                      subnet_map = {
                          'a': subnet_a,
                          'b': subnet_b,
                          'c': subnet_c,
                          'd': subnet_d
                      }
                      selected_subnet = subnet_map.get(az_suffix, subnet_a)

                      logger.info(f'Selected AZ: {az_suffix}, Selected Subnet: {selected_subnet}')
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                          'AvailabilityZone': az_suffix,
                          'SubnetId': selected_subnet
                      })
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  logger.error(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  AZSelectionCustomResource:
    Type: Custom::AZSelection
    DependsOn:
      - VSCodeServerPublicSubnetA
      - VSCodeServerPublicSubnetB
      - VSCodeServerPublicSubnetC
      - VSCodeServerPublicSubnetD
    Properties:
      ServiceToken: !GetAtt AZSelectionLambda.Arn
      Region: !Ref AWS::Region
      InstanceType: !Ref InstanceType
      AvailabilityZoneParam: !Ref AvailabilityZone
      SubnetA: !Ref VSCodeServerPublicSubnetA
      SubnetB: !Ref VSCodeServerPublicSubnetB
      SubnetC: !Ref VSCodeServerPublicSubnetC
      SubnetD: !Ref VSCodeServerPublicSubnetD

#------------------------------------------------------
# Security Group
#------------------------------------------------------
  VSCodeServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W40
            reason: allow ingress from the cloudfront prefix list
          - id: W5
            reason: allow ingress from the cloudfront prefix list
    Properties:
      GroupDescription: allow ingress from cloudfront prefix list
      VpcId: !Ref VSCodeServerVPC

  VSCodeServerSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: open port 8080 for the cloudfront prefix list
      GroupId:
        Fn::GetAtt:
          - VSCodeServerSecurityGroup
          - GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourcePrefixListId:
        Fn::FindInMap:
          - CloudFrontPrefixListIdMappings
          - Ref: AWS::Region
          - PrefixListId

  VSCodeServerSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: egress for vscode security group
      GroupId:
        Fn::GetAtt:
          - VSCodeServerSecurityGroup
          - GroupId
      IpProtocol: -1
      CidrIp: !Ref InternetCidrBlock
#------------------------------------------------------
# Role and Instance Profile
#------------------------------------------------------
  VSCodeServerIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Policies:
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/code-server/*"
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: VSCodeServerIAMRole
#------------------------------------------------------
# IAM Role for EventBridge Scheduler
#------------------------------------------------------
  EventBridgeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
                - ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonSSMAutomationRole
      Policies:
        - PolicyName: EC2InstanceScheduling
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ssm.amazonaws.com
#------------------------------------------------------
# Lambda Role for Conditional Stop
#------------------------------------------------------
  ConditionalStopLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConditionalStopPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:StartAutomationExecution
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-StopEC2Instance"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/AWS-StopEC2Instance:*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt EventBridgeSchedulerRole.Arn

  ConditionalStopLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ConditionalStopLambdaRole.Arn
      Timeout: 60
      Environment:
        Variables:
          INSTANCE_ID: !Ref VSCodeServer
          AUTOMATION_ROLE_ARN: !GetAtt EventBridgeSchedulerRole.Arn
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import boto3
          import os
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              instance_id = os.environ['INSTANCE_ID']
              automation_role_arn = os.environ['AUTOMATION_ROLE_ARN']
              region = os.environ['REGION']

              ec2_client = boto3.client('ec2', region_name=region)
              ssm_client = boto3.client('ssm', region_name=region)

              logger.info(f'Checking AutoStop tag for instance: {instance_id}')

              try:
                  # Get instance tags
                  response = ec2_client.describe_instances(InstanceIds=[instance_id])
                  if not response['Reservations']:
                      logger.warning(f'Instance {instance_id} not found')
                      return {'statusCode': 404, 'body': 'Instance not found'}

                  instance = response['Reservations'][0]['Instances'][0]
                  tags = {tag['Key']: tag['Value'] for tag in instance.get('Tags', [])}

                  # Check AutoStop tag
                  auto_stop = tags.get('AutoStop', 'enabled').lower()

                  if auto_stop == 'disabled':
                      logger.info(f'AutoStop is disabled for instance {instance_id}. Skipping stop.')
                      return {
                          'statusCode': 200,
                          'body': f'AutoStop disabled for instance {instance_id}. Stop skipped.'
                      }

                  # Check instance state
                  state = instance['State']['Name']
                  if state != 'running':
                      logger.info(f'Instance {instance_id} is in {state} state. Skipping stop.')
                      return {
                          'statusCode': 200,
                          'body': f'Instance {instance_id} is {state}. Stop skipped.'
                      }

                  # Stop instance via SSM Automation
                  logger.info(f'Stopping instance {instance_id} via SSM Automation')
                  ssm_response = ssm_client.start_automation_execution(
                      DocumentName='AWS-StopEC2Instance',
                      Parameters={
                          'InstanceId': [instance_id],
                          'AutomationAssumeRole': [automation_role_arn]
                      }
                  )

                  execution_id = ssm_response['AutomationExecutionId']
                  logger.info(f'Started SSM Automation execution: {execution_id}')

                  return {
                      'statusCode': 200,
                      'body': f'Instance {instance_id} stop initiated. Execution ID: {execution_id}'
                  }

              except Exception as e:
                  logger.error(f'Error: {str(e)}')
                  raise

  ConditionalStartLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConditionalStartPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:CreateTags
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:StartAutomationExecution
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-StartEC2Instance"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/AWS-StartEC2Instance:*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt EventBridgeSchedulerRole.Arn

  ConditionalStartLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ConditionalStartLambdaRole.Arn
      Timeout: 60
      Environment:
        Variables:
          INSTANCE_ID: !Ref VSCodeServer
          AUTOMATION_ROLE_ARN: !GetAtt EventBridgeSchedulerRole.Arn
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import boto3
          import os
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              instance_id = os.environ['INSTANCE_ID']
              automation_role_arn = os.environ['AUTOMATION_ROLE_ARN']
              region = os.environ['REGION']

              ec2_client = boto3.client('ec2', region_name=region)
              ssm_client = boto3.client('ssm', region_name=region)

              logger.info(f'Starting scheduled start process for instance: {instance_id}')

              try:
                  # Get instance tags and state
                  response = ec2_client.describe_instances(InstanceIds=[instance_id])
                  if not response['Reservations']:
                      logger.warning(f'Instance {instance_id} not found')
                      return {'statusCode': 404, 'body': 'Instance not found'}

                  instance = response['Reservations'][0]['Instances'][0]
                  tags = {tag['Key']: tag['Value'] for tag in instance.get('Tags', [])}
                  state = instance['State']['Name']

                  # Check AutoStop tag
                  auto_stop = tags.get('AutoStop', 'enabled').lower()

                  # Always reset AutoStop to enabled on morning start
                  if auto_stop == 'disabled':
                      logger.info(f'Resetting AutoStop tag from disabled to enabled for instance {instance_id}')
                      ec2_client.create_tags(
                          Resources=[instance_id],
                          Tags=[{'Key': 'AutoStop', 'Value': 'enabled'}]
                      )
                      logger.info(f'AutoStop tag reset to enabled')

                  # Start instance if it's not running
                  if state == 'running':
                      logger.info(f'Instance {instance_id} is already running. No action needed.')
                      return {
                          'statusCode': 200,
                          'body': f'Instance {instance_id} is already running. AutoStop tag reset to enabled.'
                      }

                  # Start instance via SSM Automation
                  logger.info(f'Starting instance {instance_id} via SSM Automation')
                  ssm_response = ssm_client.start_automation_execution(
                      DocumentName='AWS-StartEC2Instance',
                      Parameters={
                          'InstanceId': [instance_id],
                          'AutomationAssumeRole': [automation_role_arn]
                      }
                  )

                  execution_id = ssm_response['AutomationExecutionId']
                  logger.info(f'Started SSM Automation execution: {execution_id}')

                  return {
                      'statusCode': 200,
                      'body': f'Instance {instance_id} start initiated. Execution ID: {execution_id}'
                  }

              except Exception as e:
                  logger.error(f'Error: {str(e)}')
                  raise
#------------------------------------------------------
# EventBridge Rules for Instance Scheduling (Weekdays Only)
# NOTE: To exclude 2026-03-01 and 2026-03-02:
#   - Disable this rule on 2026-02-28 (to skip 2026-03-01 8:30 AM KST start)
#   - Keep disabled on 2026-03-01 (to skip 2026-03-02 8:30 AM KST start)
#   - Re-enable on 2026-03-02 (to resume normal schedule from 2026-03-03)
#------------------------------------------------------
  VSCodeServerStartRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Start VSCode Server at 8:00 AM KST every day (11:00 PM UTC previous day). Automatically resets AutoStop tag to enabled.
      ScheduleExpression: "cron(0 23 ? * * *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ConditionalStartLambda.Arn
          Id: ConditionalStartVSCodeServerInstance

  ConditionalStartLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConditionalStartLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt VSCodeServerStartRule.Arn

  VSCodeServerStopRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Stop VSCode Server at 8:00 PM KST every day (11:00 AM UTC). Can be overridden by setting EC2 tag AutoStop=disabled
      ScheduleExpression: "cron(0 11 ? * * *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ConditionalStopLambda.Arn
          Id: ConditionalStopVSCodeServerInstance

  ConditionalStopLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConditionalStopLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt VSCodeServerStopRule.Arn
#------------------------------------------------------
# Elastic IP for EC2 Instance
#------------------------------------------------------
  VSCodeServerEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: VSCodeServer-EIP

  VSCodeServerEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt VSCodeServerEIP.AllocationId
      InstanceId: !Ref VSCodeServer
#------------------------------------------------------
# EC2 Instance for VSCode Server
#------------------------------------------------------
  VSCodeServer:
    Type: AWS::EC2::Instance
    DependsOn: SageMakerModelsS3Bucket
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W40
            reason: allow tcp 8080 from the cloudfront prefix list
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 250
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: VSCodeServer
        - Key: AutoStop
          Value: enabled
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: "true"
          SubnetId: !GetAtt AZSelectionCustomResource.SubnetId
          GroupSet:
            - Fn::GetAtt:
                - VSCodeServerSecurityGroup
                - GroupId
      Monitoring: true
      UserData:
        Fn::Base64:
          Fn::Join:
            - ''
            - - !Sub
                - |
                  #!/bin/bash
                  echo "INFO: Starting UserData script execution"

                  # Wait for apt locks to be released (cloud-init, unattended-upgrades, etc.)
                  echo "INFO: Waiting for system apt processes to complete..."
                  while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
                    echo "INFO: Waiting for other software managers to finish..."
                    sleep 5
                  done
                  echo "INFO: System apt locks released, proceeding with setup"

                  # Install AWS CLI and jq
                  echo "INFO: Installing AWS CLI prerequisites and jq"
                  apt-get -o DPkg::Lock::Timeout=-1 update
                  DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=-1 install -y curl unzip jq
                  echo "INFO: Prerequisites and jq installed, downloading AWS CLI"
                  curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip -o /tmp/aws-cli.zip
                  echo "INFO: Extracting AWS CLI"
                  unzip -q -d /tmp /tmp/aws-cli.zip
                  echo "INFO: Installing AWS CLI"
                  sudo /tmp/aws/install
                  rm -rf /tmp/aws /tmp/aws-cli.zip
                  echo "INFO: AWS CLI installation complete"
                  aws --version

                  # Configure AWS CLI credentials
                  echo "INFO: Configuring AWS CLI credentials"
                  if [ -n "${AWS_ACCESS_KEY_ID}" ] && [ "${AWS_ACCESS_KEY_ID}" != "" ]; then
                    echo "INFO: Setting AWS credentials using Python to safely handle special characters"
                    sudo -u ubuntu mkdir -p /home/ubuntu/.aws
                    # Use printf to write credentials to temp files (safe for all special characters)
                    printf '%s' "${AWS_ACCESS_KEY_ID}" > /tmp/.aws_access_key_id
                    printf '%s' "${AWS_SECRET_ACCESS_KEY}" > /tmp/.aws_secret_access_key
                    # Python reads from files (no bash interpretation)
                    python3 -c 'import pathlib, pwd, grp, os; access_key = pathlib.Path("/tmp/.aws_access_key_id").read_text(); secret_key = pathlib.Path("/tmp/.aws_secret_access_key").read_text(); creds = pathlib.Path("/home/ubuntu/.aws/credentials"); creds.write_text(f"[default]\naws_access_key_id = {access_key}\naws_secret_access_key = {secret_key}\n"); creds.chmod(0o600); os.chown(str(creds), pwd.getpwnam("ubuntu").pw_uid, grp.getgrnam("ubuntu").gr_gid)'
                    rm -f /tmp/.aws_access_key_id /tmp/.aws_secret_access_key
                    echo "INFO: AWS credentials configured successfully"
                  else
                    echo "INFO: AWS Access Key ID not provided, skipping credentials configuration"
                  fi

                  if [ -n "${REGION}" ] && [ "${REGION}" != "" ]; then
                    echo "INFO: Setting AWS region to ${REGION}"
                    sudo -u ubuntu aws configure set region "${REGION}"
                  else
                    echo "INFO: Region not provided, skipping"
                  fi

                  # Install Docker
                  echo "INFO: Installing Docker"

                  # Wait for apt locks to be released (cloud-init, unattended-upgrades, etc.)
                  echo "INFO: Waiting for apt locks to be released..."
                  while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
                    echo "INFO: Waiting for other software managers to finish..."
                    sleep 5
                  done
                  echo "INFO: apt locks released, proceeding with Docker installation"

                  DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=-1 install -y ca-certificates gnupg lsb-release
                  echo "INFO: Adding Docker GPG key"
                  install -m 0755 -d /etc/apt/keyrings
                  curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                  chmod a+r /etc/apt/keyrings/docker.gpg
                  echo "INFO: Adding Docker repository"
                  echo \
                    "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                    $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
                  echo "INFO: Installing Docker packages"
                  apt-get -o DPkg::Lock::Timeout=-1 update
                  DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=-1 install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                  echo "INFO: Adding ubuntu user to docker group"
                  usermod -aG docker ubuntu
                  echo "INFO: Starting Docker service"
                  systemctl enable docker
                  systemctl start docker
                  echo "INFO: Docker installation complete"
                  docker --version

                  # Install code-server
                  echo "INFO: Installing code-server"
                  DEFAULT_VERSION="${VERSION}"
                - VERSION: !Ref VSCodeServerVersion
                  AWS_ACCESS_KEY_ID: !Ref AWSAccessKeyId
                  AWS_SECRET_ACCESS_KEY: !Ref AWSSecretAccessKey
                  REGION: !Ref AWS::Region
              - |
                # Try to get latest version from GitHub API (pure bash, no CloudFormation variables)
                echo "INFO: Attempting to fetch latest code-server version"
                LATEST_VERSION=$(curl -s https://api.github.com/repos/coder/code-server/releases/latest | jq -r '.tag_name' 2>/dev/null)

                if [ $? -eq 0 ] && [ -n "$LATEST_VERSION" ]; then
                  echo "INFO: Successfully fetched latest version: $LATEST_VERSION"
                  # Remove 'v' prefix using sed
                  VERSION_TO_USE=$(echo "$LATEST_VERSION" | sed 's/^v//')
                  DOWNLOAD_URL="https://github.com/coder/code-server/releases/download/${LATEST_VERSION}/code-server_${VERSION_TO_USE}_amd64.deb"
                else
                  echo "INFO: Failed to fetch latest version, using default version: $DEFAULT_VERSION"
                  VERSION_TO_USE=$DEFAULT_VERSION
                  DOWNLOAD_URL="https://github.com/coder/code-server/releases/download/v${DEFAULT_VERSION}/code-server_${DEFAULT_VERSION}_amd64.deb"
                fi

                echo "INFO: Downloading code-server from: $DOWNLOAD_URL"
                curl -fOL $DOWNLOAD_URL
                sudo dpkg -i code-server_${VERSION_TO_USE}_amd64.deb
                echo "INFO: Enabling and starting code-server"
                sudo systemctl enable --now code-server@ubuntu
                sleep 30
              - !Sub
                - |
                  # Configure password
                  echo "INFO: Configuring code-server"
                  # sed -i.bak 's/auth: password/auth: none/' /home/ubuntu/.config/code-server/config.yaml
                  # Expose code server service
                  sed -i.bak 's/bind-addr: 127.0.0.1:8080/bind-addr: 0.0.0.0:8080/' /home/ubuntu/.config/code-server/config.yaml

                  # Restart code server
                  echo "INFO: Restarting code-server"
                  sudo systemctl restart code-server@ubuntu

                  # Install extension amazonwebservices.amazon-q-vscode
                  echo "INFO: Installing Amazon Q extension"
                  sudo -u ubuntu code-server --install-extension amazonwebservices.amazon-q-vscode

                  # Restart code server
                  echo "INFO: Final restart of code-server"
                  sudo systemctl restart code-server@ubuntu

                  # Store password in SSM Parameter Store for easy retrieval
                  echo "INFO: Storing password in SSM Parameter Store"
                  sleep 10  # Wait for config file to be fully written
                  CODE_SERVER_PASSWORD=$(sudo grep "^password:" /home/ubuntu/.config/code-server/config.yaml | cut -d' ' -f2)
                  echo "INFO: Extracted password, creating SSM parameter"
                  aws ssm put-parameter \
                    --name "/code-server/password" \
                    --value "$CODE_SERVER_PASSWORD" \
                    --type "SecureString" \
                    --region ${AWS::Region} \
                    --overwrite
                  echo "INFO: SSM parameter creation complete"

                  # Clone GitHub repository if token is provided
                  if [ -n "${GITHUB_TOKEN}" ]; then
                    echo "INFO: GitHub access token provided, cloning repository"
                    cd /home/ubuntu
                    sudo -u ubuntu git clone https://x-access-token:${GITHUB_TOKEN}@github.com/shkim4u/${PROJECT_NAME}
                    echo "INFO: Repository cloned successfully"

                    # Configure VSCode Server environemnts, including Python 3.12, Node.js 22, Claude Code and Amazon Q
                    echo "INFO: Configuring VSCode Server environment"
                    if [ -n "${AWS_BEARER_TOKEN_BEDROCK}" ] && [ "${AWS_BEARER_TOKEN_BEDROCK}" != "" ]; then
                      if [ -n "${OPENAI_API_KEY}" ] && [ "${OPENAI_API_KEY}" != "" ]; then
                        echo "INFO: AWS Bearer Token and OpenAI API Key provided, configuring with both"
                        sudo -i -u ubuntu bash -c "cd /home/ubuntu/${PROJECT_NAME} && ./configure-vscode-server.sh --aws-bearer-token-bedrock ${AWS_BEARER_TOKEN_BEDROCK} --openai-api-key ${OPENAI_API_KEY}"
                      else
                        echo "INFO: AWS Bearer Token provided, configuring with token (no OpenAI key)"
                        sudo -i -u ubuntu bash -c "cd /home/ubuntu/${PROJECT_NAME} && ./configure-vscode-server.sh --aws-bearer-token-bedrock ${AWS_BEARER_TOKEN_BEDROCK}"
                      fi
                    else
                      if [ -n "${OPENAI_API_KEY}" ] && [ "${OPENAI_API_KEY}" != "" ]; then
                        echo "INFO: OpenAI API Key provided, configuring with key (no AWS Bearer Token)"
                        sudo -i -u ubuntu bash -c "cd /home/ubuntu/${PROJECT_NAME} && ./configure-vscode-server.sh --openai-api-key ${OPENAI_API_KEY}"
                      else
                        echo "INFO: No AWS Bearer Token or OpenAI API Key provided, configuring without tokens"
                        sudo -i -u ubuntu bash -c "cd /home/ubuntu/${PROJECT_NAME} && ./configure-vscode-server.sh"
                      fi
                    fi
                  else
                    echo "INFO: No GitHub access token provided, skipping repository clone"
                  fi

                  # Configure SSH public key for Remote SSH
                  if [ -n "${REMOTE_SSH_PUBLIC_KEY}" ]; then
                    echo "INFO: Configuring SSH public key for VSCode Remote SSH"
                    sudo -i -u ubuntu bash -c "mkdir -p ~/.ssh && chmod 700 ~/.ssh"
                    sudo -i -u ubuntu bash -c "echo '${REMOTE_SSH_PUBLIC_KEY}' >> ~/.ssh/authorized_keys"
                    sudo -i -u ubuntu bash -c "chmod 600 ~/.ssh/authorized_keys"
                    echo "INFO: SSH public key configuration complete"
                  else
                    echo "INFO: No SSH public key provided, skipping SSH configuration"
                  fi

                  # Sync SageMaker models to S3 bucket
                  if [ -d "/home/ubuntu/${PROJECT_NAME}" ]; then
                    echo "INFO: Syncing SageMaker models to S3 bucket"
                    if sudo -i -u ubuntu bash -c "cd /home/ubuntu/${PROJECT_NAME} && ./scripts/sync-sagemaker-models-from-source.sh --target-bucket ${S3_BUCKET_NAME}"; then
                      echo "INFO: SageMaker models sync completed successfully"
                    else
                      echo "ERROR: SageMaker models sync failed with exit code $?"
                    fi
                  else
                    echo "INFO: ${PROJECT_NAME} directory not found, skipping SageMaker models sync"
                  fi

                  # npm build and deploy (only if DeployProjectResource is True)
                  DEPLOY_RESOURCE=$(echo "${DEPLOY_PROJECT_RESOURCE}" | tr '[:upper:]' '[:lower:]')
                  DEPLOY_INIT_MINIMAL=$(echo "${DEPLOY_INIT_MINIMAL}" | tr '[:upper:]' '[:lower:]')
                  if [ "$DEPLOY_RESOURCE" = "true" ]; then
                    if [ -d "/home/ubuntu/${PROJECT_NAME}" ]; then
                      if [ "$DEPLOY_INIT_MINIMAL" = "true" ]; then
                        echo "INFO: Running npm build and deploy:init-minimal for ${PROJECT_NAME}"
                        if sudo -u ubuntu bash -c 'export HOME=/home/ubuntu && cd $HOME && source ~/.bashrc && export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" && cd '"${PROJECT_NAME}"' && cp bin/config-init-minimal.json bin/config.json && npm ci && npm run bootstrap && npm run build && npm run deploy'; then
                          echo "INFO: npm build and deploy:init-minimal completed successfully"
                        else
                          echo "ERROR: npm build and deploy:init-minimal failed with exit code $?"
                        fi
                      else
                        echo "INFO: Running npm build and deploy for ${PROJECT_NAME}"
                        if sudo -u ubuntu bash -c 'export HOME=/home/ubuntu && cd $HOME && source ~/.bashrc && export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" && cd '"${PROJECT_NAME}"' && npm ci && npm run bootstrap && npm run build && npm run deploy'; then
                          echo "INFO: npm build and deploy completed successfully"
                        else
                          echo "ERROR: npm build and deploy failed with exit code $?"
                        fi
                      fi
                    else
                      echo "INFO: ${PROJECT_NAME} directory not found, skipping npm build and deploy"
                    fi
                  else
                    echo "INFO: DeployProjectResource is false, skipping npm build and deploy"
                  fi

                  # Execute post-configuration script if exists
                  if [ -f "/home/ubuntu/${PROJECT_NAME}/post-configure-vscode-server.sh" ]; then
                    echo "INFO: Executing post-configuration script"
                    if sudo -i -u ubuntu bash -c "cd /home/ubuntu/${PROJECT_NAME} && ./post-configure-vscode-server.sh"; then
                      echo "INFO: Post-configuration script completed successfully"
                    else
                      echo "ERROR: Post-configuration script failed with exit code $?"
                    fi
                  else
                    echo "INFO: Post-configuration script not found, skipping"
                  fi

                  echo "INFO: UserData script execution finished"
                - GITHUB_TOKEN: !Ref GitHubAccessToken
                  REMOTE_SSH_PUBLIC_KEY: !Ref RemoteSSHPublicKey
                  S3_BUCKET_NAME: !GetAtt SageMakerModelsS3Bucket.BucketName
                  PROJECT_NAME: !Ref ProjectName
                  DEPLOY_PROJECT_RESOURCE: !Ref DeployProjectResource
                  DEPLOY_INIT_MINIMAL: !Ref DeployInitMinimal
                  AWS_BEARER_TOKEN_BEDROCK: !Ref AWSBearerTokenBedrock
                  OPENAI_API_KEY: !Ref OpenAIAPIKey
#------------------------------------------------------
# CloudFront Cached Policy
#------------------------------------------------------
  VSCodeServerCloudFrontCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 1
        Name: !Join ['-', ['VSCodeServer', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: all
          EnableAcceptEncodingGzip: False
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Accept-Charset
              - Authorization
              - Origin
              - Accept
              - Referer
              - Host
              - Accept-Language
              - Accept-Encoding
              - Accept-Datetime
          QueryStringsConfig:
            QueryStringBehavior: all
#------------------------------------------------------
# CloudFront Distribution
#------------------------------------------------------
  VSCodeServerCloudFront:
    Type: AWS::CloudFront::Distribution
    DependsOn: VSCodeServerEIPAssociation
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W10
            reason: disable access logging for demo purpose
          - id: W70
            reason: no TLS version for demo purpose
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt VSCodeServer.PublicDnsName
            Id: VS-code-server
            CustomOriginConfig:
              HTTPPort: 8080
              OriginProtocolPolicy: http-only
        Enabled: true
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          ForwardedValues:
            QueryString: 'false'
          Compress: false
          TargetOriginId: VS-code-server
          ViewerProtocolPolicy: allow-all
          OriginRequestPolicyId: !Ref OriginRequestPolicyId
          CachePolicyId: !Ref VSCodeServerCloudFrontCachePolicy
#------------------------------------------------------
# Exported output
#------------------------------------------------------
Outputs:
  VSCodeServerCloudFrontDomainName:
    Value:
      !Sub
        - "https://${domain}"
        - { domain: !GetAtt VSCodeServerCloudFront.DomainName }
    Export:
      Name: !Sub ${AWS::StackName}-domain-name
  VSCodeServerPublicIP:
    Value: !Ref VSCodeServerEIP
    Export:
      Name: !Sub ${AWS::StackName}-code-server-public-ip
  VSCodeServerPrivateIP:
    Value: !GetAtt VSCodeServer.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-code-server-private-ip
  VSCodeServerRoleARN:
    Value: !GetAtt VSCodeServerIAMRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-code-server-role-arn
  VSCodeServerInstanceId:
    Value: !Ref VSCodeServer
    Export:
      Name: !Sub ${AWS::StackName}-code-server-instance-id
  VSCodeServerPasswordSSM:
    Description: SSM Parameter containing the code-server password
    Value: "/code-server/password"
    Export:
      Name: !Sub ${AWS::StackName}-code-server-password-ssm
  AutoStopOverrideInstructions:
    Description: To override auto-stop for the day, set AutoStop=disabled. It will be automatically reset to enabled at 8:00 AM KST next day.
    Value: !Sub
      - "To disable auto-stop: aws ec2 create-tags --resources ${InstanceId} --tags Key=AutoStop,Value=disabled | Tag will be automatically reset to enabled at 8:00 AM KST"
      - InstanceId: !Ref VSCodeServer
